{% extends 'academy/base.html' %}
{% block content %}
<h2>Available Training Courses</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
    {% for course in courses %}
        <div style="border: 1px solid #ddd; padding: 20px; border-radius: 6px; background: #fafafa;">
            <h3>{{ course.title }}</h3>
            <p>{{ course.description|truncatewords:20 }}</p>
            <p><strong>Price:</strong> ${{ course.price }}</p>
            <a href="{% url 'course_detail' course.id %}" class="btn">View Details & Enroll</a>
        </div>
    {% empty %}
        <p>No courses found.</p>
    {% endfor %}
</div>
{% endblock %}
